<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg">
    <link rel="stylesheet" href="style.css">
    <title>Hexcite</title>
</head>
<body>
<section id="title-screen">
    <div id="main-menu" class="title-content">
        <h1>HEXCITE</h1>
        <div class="start-tiles">
            <button id="one-player" class="start-tile">
                <span class="tile-number">1P</span>
                <span class="tile-detail">Against the computer</span>
            </button>
            <button id="two-player" class="start-tile second">
                <span class="tile-number">2P</span>
                <span class="tile-detail">Play on this device</span>
            </button>
        </div>
        <button id="practice" class="practice-start">Practice <span>50 original boards</span></button>
        <div class="music-setting">
            <span id="music-label">Music</span>
            <div id="music-tracks" role="group" aria-labelledby="music-label">
                <button type="button" value="1" aria-label="Track 1" aria-pressed="false">1</button>
                <button type="button" value="6" aria-label="Track 2" aria-pressed="false">2</button>
                <button type="button" value="7" aria-label="Track 3" aria-pressed="false">3</button>
                <button type="button" value="8" aria-label="Track 4" aria-pressed="false">4</button>
                <button type="button" value="10" aria-label="Track 5" aria-pressed="false">5</button>
                <button type="button" value="11" aria-label="Track 6" aria-pressed="false">6</button>
                <button type="button" value="14" aria-label="Track 7" aria-pressed="false">7</button>
                <button type="button" value="0" aria-pressed="true">Off</button>
            </div>
        </div>
        <button id="resume" class="resume" hidden>Resume Match</button>
    </div>
    <div id="practice-menu" class="title-content" hidden>
        <button id="practice-back" class="quiet">← Back</button>
        <h2>Practice</h2>
        <p>Beat the computer to clear each board.</p>
        <p id="practice-progress"></p>
        <div id="practice-boards" aria-label="Choose a practice board"></div>
    </div>
</section>
<main id="game-screen" hidden inert>
    <section class="player-panel" data-player="0">
        <div id="player-1-score"></div>
        <div id="player-1-pieces" class="piece-display"><svg class="piece-strip" width="0" height="0"></svg></div>
    </section>
    <div class="game-center">
        <div class="board-area">
            <svg id="board" viewBox="-243 -225 486 450"></svg>
            <div id="result" hidden>
                <div id="result-title" class="result-titlebar">Match Complete</div>
                <p id="result-message" aria-live="polite"></p>
                <button id="play-again" class="primary">Play Again</button>
            </div>
        </div>
        <div class="controls">
            <button id="menu" class="quiet">Menu</button>
            <span id="practice-status" hidden aria-label="Practice board"></span>
            <button id="retry" class="quiet" hidden>Retry</button>
            <button id="hint" class="quiet">Hint</button>
            <button id="place" class="primary" hidden disabled>Place Piece</button>
            <button id="pass" class="quiet" hidden>Pass</button>
        </div>
    </div>
    <section class="player-panel" data-player="1">
        <div id="player-2-pieces" class="piece-display"><svg class="piece-strip" width="0" height="0"></svg></div>
        <div id="player-2-score"></div>
    </section>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
