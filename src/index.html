<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg">
    <link rel="stylesheet" href="style.css">
    <title>Hexcite</title>
</head>
<body>
<section id="title-screen">
    <div id="main-menu" class="title-content">
        <h1>HEXCITE</h1>
        <div class="start-tiles">
            <button id="one-player" class="start-tile">
                <span class="tile-number">1P</span>
                <span class="tile-detail">Against the computer</span>
            </button>
            <button id="two-player" class="start-tile second">
                <span class="tile-number">2P</span>
                <span class="tile-detail">Play on this device</span>
            </button>
        </div>
        <button id="practice" class="practice-start">Practice <span>50 original boards</span></button>
        <button id="resume" class="resume" hidden>Resume Match</button>
    </div>
    <div id="practice-menu" class="title-content" hidden>
        <button id="practice-back" class="quiet">← Back</button>
        <h2>Practice</h2>
        <p>Beat the computer to clear each board.</p>
        <p id="practice-progress"></p>
        <div id="practice-boards" aria-label="Choose a practice board"></div>
    </div>
</section>
<main id="game-screen" hidden inert>
    <section class="player-panel" data-player="0">
        <div id="player-1-score"></div>
        <div id="player-1-pieces" class="piece-display"></div>
    </section>
    <div class="board-area">
        <svg id="board" viewBox="-270 -250 540 500"></svg>
        <div id="result" hidden>
            <div id="result-title" class="result-titlebar">Match Complete</div>
            <p id="result-message" aria-live="polite"></p>
            <button id="play-again" class="primary">Play Again</button>
        </div>
    </div>
    <div class="controls">
        <button id="menu" class="quiet">Menu</button>
        <span id="practice-status" hidden aria-label="Practice board"></span>
        <button id="retry" class="quiet" hidden>Retry</button>
        <button id="hint" class="quiet">Hint</button>
        <button id="place" class="primary" hidden disabled>Place Piece</button>
        <button id="pass" class="quiet" hidden>Pass</button>
    </div>
    <section class="player-panel" data-player="1">
        <div id="player-2-pieces" class="piece-display"></div>
        <div id="player-2-score"></div>
    </section>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
