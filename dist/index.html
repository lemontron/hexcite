<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Hexcite Pocket</title>
</head>
<body>
  <section id="title-screen" aria-label="Title screen">
    <div class="title-content">
      <div class="title-kicker">POCKET EDITION</div>
      <h1>hexcite<span>.</span></h1>
      <p class="title-subtitle">Geometric strategy</p>
      <div class="start-tiles">
        <button id="one-player" class="start-tile">
          <span class="tile-number">1</span>
          <span class="tile-label">1 Player</span>
          <span class="tile-detail">Against the computer</span>
        </button>
        <button id="two-player" class="start-tile second">
          <span class="tile-number">2</span>
          <span class="tile-label">2 Players</span>
          <span class="tile-detail">Play on this device</span>
        </button>
      </div>
      <button id="resume" class="resume" hidden>Resume match →</button>
    </div>
  </section>
  <main id="game-screen" hidden inert>
    <section class="game">
      <div id="scores"></div>
      <div id="result" hidden aria-live="polite"></div>
      <div class="playarea">
        <div id="opponent-pieces" class="piece-display" aria-label="Opponent pieces"></div>
        <svg id="board" viewBox="-270 -250 540 500" role="group" aria-label="Hexagonal game board"></svg>
      </div>
    </section>
    <section class="rack">
      <div class="controls">
        <button id="hint" class="quiet">Find a move</button>
        <button id="rotate">↻ Rotate</button>
        <button id="place" class="primary" disabled>Place piece ↗</button>
        <button id="pass" class="quiet">Pass →</button>
      </div>
      <div id="pieces" class="piece-display" aria-label="Piece dock"></div>

    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
